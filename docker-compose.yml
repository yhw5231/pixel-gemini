# ── Pixel Gemini – one-command container stack ───────────────────────────────
services:
  pixel-gemini:
    build: .
    container_name: pixel-gemini
    ports:
      - "8910:8910"
    environment:
      # Web admin credentials (defaults: admin / admin)
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      # Session signing key – change in production!
      SECRET_KEY: change-me-in-production
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8910
      # Optional Telegram bot (leave empty to disable)
      TELEGRAM_BOT_TOKEN: ""
      # chromedriver: 默认使用镜像内置的 /usr/local/bin/chromedriver（构建期
      # 已从 Selenium Manager 缓存或系统 chromium-driver 复制），版本不匹配时
      # 代码会自动回退到 Selenium Manager 联网下载。留空则走 Selenium Manager
      # 自动检测，无网络时可能失败（arm64 上尤其如此）。
      CHROMEDRIVER_PATH: /usr/local/bin/chromedriver
      # Optional egress proxy – strongly recommended (Google flags
      # datacenter IPs). Example: http://user:pass@host:port
      PROXY_URL: ""
      # Simulated device locale/timezone – keep consistent with proxy region
      DEVICE_TIMEZONE: America/Los_Angeles
      DEVICE_LANGUAGE: en-US
    volumes:
      - pixel-gemini-data:/data
    restart: unless-stopped

volumes:
  pixel-gemini-data:
